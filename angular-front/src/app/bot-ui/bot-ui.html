<div class="p-3">
  <div class="card-body">
  <input [(ngModel)]="query" type="text" class="form-control m-2" style="display: inline; width: 80%">
    <button (click)="askAgent()" class="btn btn-primary" style="display: inline">
      <i class="bi bi-search"></i>
    </button>
    @if (loadingService.isLoading()){
      <div class="spinner-border text-warning" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    }
  </div>
  <div class="card-body">
    @if (response$ | async ; as botResponse){
      <markdown [data]="botResponse"></markdown>
    }

  </div>
</div>
